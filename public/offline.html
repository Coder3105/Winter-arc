<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#03070c" />
    <title>Offline | Winter Arc</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-width: 0;
        min-height: 100%;
        background: #03070c;
        color: #f2fbff;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 30%, #103c5250, transparent 40%), #03070c;
      }
      .panel {
        width: min(100%, 520px);
        padding: 32px 22px;
        border: 1px solid #8de7ff;
        background: #050f18;
        text-align: center;
        box-shadow: 0 20px 60px #0008;
      }
      .eyebrow {
        color: #527d94;
        font-size: 11px;
        letter-spacing: 0.24em;
      }
      .signal {
        color: #8de7ff;
        font-size: 11px;
        letter-spacing: 0.2em;
      }
      h1 {
        margin: 14px 0;
        color: #dff9ff;
        font:
          400 clamp(38px, 12vw, 64px) Baskerville,
          serif;
        letter-spacing: 0.12em;
      }
      p {
        margin: 0 auto 28px;
        max-width: 410px;
        color: #a8c3d1;
        font-size: 14px;
        line-height: 1.65;
      }
      a {
        display: grid;
        min-height: 52px;
        padding: 12px 18px;
        border: 1px solid #8de7ff;
        color: #dff9ff;
        place-items: center;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="eyebrow">SYSTEM</div>
        <div class="signal">CONNECTION LOST</div>
        <h1>OFFLINE</h1>
        <p>
          Winter Arc requires a secure connection to access private tracking data. Your
          private health and habit records are not stored in the PWA cache.
        </p>
        <a href="/">RETRY CONNECTION</a>
      </section>
    </main>
  </body>
</html>
